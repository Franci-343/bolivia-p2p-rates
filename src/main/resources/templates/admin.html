<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolivia P2P Rates — Panel de Administración</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#070d19'
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX 2.0.4 CDN (14 KB) -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- LOGIN SCREEN (Cuando no ha iniciado sesión) -->
    <div th:if="${!isAdminLoggedIn}" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-6">
                <span class="text-3xl">🇧🇴</span>
                <h1 class="text-xl font-black text-white mt-2 tracking-tight">Bolivia P2P Rates Monitor</h1>
                <p class="text-xs text-slate-400 mt-1">Panel de Control & Gestión de Clientes</p>
            </div>

            <div th:if="${loginError != null}" class="mb-5 p-3 rounded-lg bg-rose-950 border border-rose-800 text-rose-300 text-xs text-center font-medium">
                <span th:text="${loginError}">Clave incorrecta</span>
            </div>

            <form action="/admin/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Clave Maestra de Administrador (API Key)</label>
                    <input type="password" name="adminKey" required placeholder="Ingresa tu clave maestra..." autocomplete="current-password"
                           class="w-full bg-slate-950 border border-slate-700 rounded-lg text-sm text-white px-3.5 py-2.5 focus:border-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-sm transition shadow">
                    Ingresar al Panel
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD (Cuando está autenticado) -->
    <div th:if="${isAdminLoggedIn}" class="min-h-screen flex flex-col">
        <!-- Top Navbar -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🇧🇴</span>
                    <div>
                        <h1 class="text-base font-extrabold text-white tracking-tight leading-none">Bolivia P2P Rates</h1>
                        <span class="text-[11px] text-emerald-400 font-medium">Panel de Administración</span>
                    </div>
                </div>

                <div class="flex items-center gap-3 sm:gap-4">
                    <a href="/api/v1/rates/latest" target="_blank"
                       class="text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1 transition">
                        <span>JSON API</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>

                    <form action="/admin/logout" method="POST">
                        <button type="submit" class="text-xs text-slate-400 hover:text-rose-400 font-semibold px-2 py-1 transition">
                            Salir
                        </button>
                    </form>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-8">
            <!-- 1. Rates Fragment -->
            <div th:replace="~{fragments/rates-card}"></div>

            <!-- 2. Clients Management Fragment -->
            <div th:replace="~{fragments/clients-section}"></div>
        </main>

        <!-- Footer -->
        <footer class="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-600">
            Bolivia P2P Rates Monitor &bull; Java 25 &bull; Javalin 7 &bull; SQLite WAL &bull; HTMX &bull; Thymeleaf
        </footer>
    </div>

</body>
</html>
