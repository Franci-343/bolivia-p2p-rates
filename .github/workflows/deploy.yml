name: Build and Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build Fat JAR and Run Tests
        run: mvn clean package --batch-mode

      - name: Ensure Target Directory Exists on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            mkdir -p /home/ubuntu/bolivia-p2p-rates/database

      - name: Copy JAR to Oracle Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "target/bolivia-p2p-rates-0.1.0-SNAPSHOT.jar"
          target: "/home/ubuntu/bolivia-p2p-rates/"
          strip_components: 1

      - name: Copy Database Migration Scripts to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "database/*.sql"
          target: "/home/ubuntu/bolivia-p2p-rates/database/"
          strip_components: 1

      - name: Configure Systemd and Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /home/ubuntu/bolivia-p2p-rates
            # Keep consistent jar name
            mv -f bolivia-p2p-rates-0.1.0-SNAPSHOT.jar bolivia-p2p-rates.jar 2>/dev/null || true

            # Detect Java 25 path (SDKMAN or system default)
            if [ -f "/home/ubuntu/.sdkman/candidates/java/current/bin/java" ]; then
                JAVA_PATH="/home/ubuntu/.sdkman/candidates/java/current/bin/java"
            elif [ -f "/usr/bin/java" ]; then
                JAVA_PATH="/usr/bin/java"
            else
                JAVA_PATH=$(which java)
            fi
            echo "Using Java binary: $JAVA_PATH"

            # Auto-create or update bolivia-rates.service
            sudo tee /etc/systemd/system/bolivia-rates.service > /dev/null << EOF
[Unit]
Description=Bolivia P2P Rates Monitor Service
After=network.target

[Service]
Type=simple
User=ubuntu
WorkingDirectory=/home/ubuntu/bolivia-p2p-rates
ExecStart=$JAVA_PATH -Xms96m -Xmx256m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -jar /home/ubuntu/bolivia-p2p-rates/bolivia-p2p-rates.jar
Restart=always
RestartSec=5
Environment=PORT=8080
Environment=POLL_INTERVAL_SECONDS=600
Environment=SQLITE_DB_PATH=database/rates.db
MemoryMax=450M

[Install]
WantedBy=multi-user.target
EOF

            # Reload, enable and restart service
            sudo systemctl daemon-reload
            sudo systemctl enable bolivia-rates
            sudo systemctl restart bolivia-rates

            # Wait 3 seconds and verify service status
            sleep 3
            sudo systemctl status bolivia-rates --no-pager
